version: '3.8'

services:
  portainer_agent:
    image: portainer/agent:2.33.2
    networks:
      - portainer_agent_network
    ports:
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
      - /etc/localtime:/etc/localtime:ro
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
      resources:
        limits:
          cpus: '0.25'
          memory: '256M'
      update_config:
        parallelism: 2 # 同时升级[回滚]的容器数
        delay: 10s
        order: stop-first

networks:
  portainer_agent_network:
    name: portainer_agent_network
    driver: overlay


# 在swarm集群的管理节点部署
# docker stack deploy portainer-agent --compose-file=portainer-agent-stack.yml --with-registry-auth
