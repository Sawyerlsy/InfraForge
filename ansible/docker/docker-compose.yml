version: '3.8'
services:
  semaphore:
    image: semaphoreui/semaphore:v2.17.35-ansible2.16.5
    container_name: semaphore
    privileged: true
    user: "0"
    restart: always
    ports:
      - 3000:3000
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: hgrica1@
      SEMAPHORE_ADMIN_NAME: admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
    volumes:
      - ./data:/var/lib/semaphore
      - ./conf:/etc/semaphore
      - ./tmp:/tmp/semaphore
      - ./resources:/root/app
    logging:
      driver: "json-file"
      options:
        max-size: "20m"  # 每个日志文件最大20MB
        max-file: "10"   # 轮转保留10个文件，总计约200MB
        compress: "true" # 启用压缩，节省空间（可选）
