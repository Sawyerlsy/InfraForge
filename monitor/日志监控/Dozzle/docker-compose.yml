version: "3"
services:
  # docker run --name dozzle -d --volume=/var/run/docker.sock:/var/run/docker.sock:ro -p 8888:8080 amir20/dozzle:latest
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    environment:
      - DOZZLE_DOCKER_HOST=tcp://host1:2375,tcp://host2:2375 # 不填则默认检测本机
      - DOZZLE_AUTH_USERNAME=admin
      - DOZZLE_AUTH_PASSWORD=hgrica1@
