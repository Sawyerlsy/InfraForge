# Sample Logstash configuration for creating a simple
# Beats -> Logstash -> Elasticsearch pipeline.

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
 #解析第一关键字日志格式：[系统初始化]
 #[2023-05-03 18:27:52.100][收费站编号][INFO] [系统初始化] |程序正常启动，启动时间: 2023-05-03 18:27:52
 if "[系统初始化]" in [message] {
        grok {
                # 使用预定义的模式来匹配日志行
                         match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:majorWord}\]"
                                           }
                 }
 }
 #解析第一关键字日志格式：[RSU信息]
 #[2023-11-12 15:15:40 633][车道编号][INFO][RSU信息]|天线初始化完成，RSU状态：正常，RSU ID：0x08000001；RSU功率：21；算法标识：0x00； RSU软件版本：0x2000；PSAM卡个数：1；PSAM卡终端机编号：21330001F4D9
 else if "[RSU信息]" in [message]{
        grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:majorWord}\]"
                                                  }
                 }
 }
  #解析第一关键字日志格式：[OBU信息|
  #[2023-11-12 15:15:40 633][车道编号][INFO][通行日志ID][0x5503662C][OBU信息|系统信息] |收到OBU信息，标签号:0x5503662C；OBU序列号:4501207800222764；启用时间:20230613；到期时间:20310613；发行方:B9E3CEF745010001；网络编号:4501；OBU状态：正常
 else if "[OBU信息" in [message]{
        grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:logPassId}\]\[%{DATA:mediaNo}\]\[%{DATA:majorWord}\]"
                                         }
                 }
 }
  #解析第一关键字日志格式：[ETC卡信息
  #[2023-11-12 15:15:40 664][车道编号][INFO][通行日志ID][0x5503662C][ETC卡信息|0002]|卡内余额:2099837828; ……
 else if[message] =~ '\[ETC卡信息'{
        grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:logPassId}\]\[%{DATA:mediaNo}\]\[%{DATA:majorWord}\]"
                                         }
                 }
 }
 #解析第一关键字日志格式：[数据交互
  #[2023-11-12 15:15:40 632][车道编号][INFO][通行日志ID][数据交互|收到RSU数据]|获取到一帧数据
 else if[message] =~ '\[数据交互'{
        grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:logPassId}\]\[%{DATA:majorWord}\]"
                                         }
                 }
 }
 #解析第一关键字日志格式：[CPC卡信息
 #[2023-11-12 15:15:40 523][车道编号][INFO][通行日志ID][4301019201000055][CPC卡信息|系统信息]|收到CPC卡MF/EF01系统信息文件信息，发行方标识：BAFEC4CF43010001;启用时间：20230613;到期时间:20310613;版本号:0x00; ……
 else if[message] =~ '\[CPC卡信息'{
        grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:logPassId}\]\[%{DATA:mediaNo}\]\[%{DATA:majorWord}\]"
                                         }
                 }
 }
 #解析第一关键字日志格式：[处理流程
 #[2023-11-12 15:15:40 665][收费站编号][INFO][通行日志ID][0x5503662C][处理流程|有效性判断]|查询发行日期是否过期 启用日期:2023-06-13 00:00:00;结束日期:2031-06-13 00:00:00
 else if[message] =~ '\[处理流程'{
        grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:logPassId}\]\[%{DATA:mediaNo}\]\[%{DATA:majorWord}\]"
                                         }
                 }
 }
 #解析第一关键字��志格式：[设备信息
 #[2023-11-12 15:15:40 940][车道编号][INFO][通行日志ID][0x5503662C][设备信息|E4|自动栏杆机]|执行栏杆抬起
 else if[message] =~ '\[设备信息'{
        grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:logPassId}\]\[%{DATA:mediaNo}\]\[%{DATA:majorWord}\]"
                                         }
                 }
 }
 #解析第一关键字日志格式：[系统信息
 #[2023-11-12 15:15:40 940] [收费站编号] [INFO] [系统信息|网络状态] |通讯连接断开
 else if[message] =~ '\[系统信息'{

     if "unisTradeSys" in [fields][logType]{
          grok{
             match =>{
                "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\] \[%{DATA:majorWord}\]"
             }
          }
       } else{
          grok {
                # 使用预定义的模式来匹配日志行
                        match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:majorWord}\]"
                                         }
                 }
        }
 }
 else if "[人工操作" in [message]{
        grok {
                # 使用预定义的模式来匹配日志行
              match => { "message" => "\[%{TIMESTAMP_ISO8601:logTime}\]\[%{DATA:laneNo}\]\[%{LOGLEVEL:logLevel}\]\[%{DATA:logPassId}\]\[%{DATA:majorWord}\]"
                        }
             }
 }
 else{
    # 如果日志不匹配任何已知格式，可以记录警告或采取其他操作
    mutate {
              add_field => { "logErrorMsg" =>"无法处理该日志格式..." }
           }
 }
 #入库时间
 ruby {
    code => "event.set('createTime', (Time.now+8*3600).utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ'))"
  }
 #事件的字段进行修改
 mutate {
       add_field => { "logPath" => "%{[log][file][path]}"
                      "logOffset" => "%{[log][offset]}"
                      "logType" => "%{[fields][logType]}"
                     }
       remove_field => ["agent","@version","event","ecs","log","tags","input","fields"]
       convert => { "logOffset" => "integer" }
      #gsub => [
      # 在下面添加你想替换的特殊符号和替换字符的映射
        #     "majorWord", "\|", "-"
        #       ]
  }
 grok{
        match =>{ "logPath"=> ".*/%{GREEDYDATA:logFileName}$"}
    }
}


output {
  #输出es
  elasticsearch {
    hosts => ["172.31.0.21:9200"]
    index => "wcs-standardlog-%{+YYYY-MM-dd}"
    document_id => "%{logFileName}-%{logOffset}"
    user => "elastic"
    password => "Hgrica1@2024"
  }
   #输出kafka
   kafka {
    bootstrap_servers => "kafka0:9091,kafka1:9092,kafka2:9093"  # 替换为你的 Kafka 服务器地址和端口
    topic_id => "logstash-stationlog-topic"  # 替换为你的 Kafka 主题名称
    codec => json  # 选择合适的编解码器，这里使用 JSON
  }
  #控制台打印
 # stdout { codec => rubydebug }

}
