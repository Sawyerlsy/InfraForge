input {
  beats {
    port => 5044 # 监听 5044 端口，接收 Filebeat 数据
  }
}

filter {
  # 根据不同的 service 标签进行条件判断，进行个性化处理
  if [service] == "virtual-station-trade" {
    # 替代 promtail 中从文件路径提取 directory 的 regex stage
    grok {
      match => { "path" => ".*/virtual-station-trade/%{WORD:directory}/all/logall\.log$" }
    }
  }

  # 处理日志正文：提取 timestamp, level, thread 等字段
  # 这替代了 promtail 中复杂的 regex pipeline stage
  grok {
    match => { "message" => "(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>\w+)\s+\d+\s+---\s+\[(?<thread>[^\]]+)\]\s+(?<class>\S+)\s+(?<method>\w+):(?<line>\d+)\s+:(?<log_body>.*)" }
  }

  # 解析时间戳，替代 promtail 的 timestamp stage
  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    timezone => "Asia/Shanghai"
    target => "@timestamp" # 解析后的时间戳存储到 @timestamp 字段，这是 ES 的标准时间字段
  }

  # 如果日志体是 JSON，可以进一步解析
  if [log_body] and [log_body] =~ /^{.*}$/ {
    json {
      source => "log_body"
    }
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
      hosts => ["http://10.194.65.135:9200"] # Elasticsearch 地址
      user => "elastic"
      password => "elastic"
      data_stream => "true"    # 对于日志文件，使用  Data Stream API 向 ES 注入数据
      data_stream_type => "logs"
      data_stream_dataset => "virtual-station-old"
      data_stream_namespace => "production"
    }



  # 开发阶段可以同时输出到标准输出，便于调试
  stdout {
    codec => rubydebug
  }
}
