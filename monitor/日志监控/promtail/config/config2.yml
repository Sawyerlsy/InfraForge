server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.194.68.225:3100/loki/api/v1/push
    batchsize: 1048576     # 单批次最大1MB（减少小包网络传输）[1](@ref)
    batchwait: 1s          # 批次最大等待时间（平衡实时性与吞吐量）
    timeout: 10s           # 网络请求超时（避免僵死连接）
    backoff_config: # 失败重试策略（增强容错）
      min_period: 500ms    # 最小重试间隔
      max_period: 5m       # 最大重试间隔
      max_retries: 10      # 最大重试次数
#    basic_auth: # 基础认证
#      username: "loki_user"
#      password: "!secure_password!"

# ===== 日志抓取任务配置 =====
scrape_configs:
  - job_name: fee-server-logs
    pipeline_stages: # 日志处理流水线
      # 前置空行过滤（立即执行）
      - drop:
          expression: '^\s*$'
      # 防止业务日志中次级时间戳（如"2024-11-12 14:28:19.853"）干扰合并，精确匹配主日志行头（时间戳+级别+线程标识）
      - multiline: # 合并多行日志（如Java异常栈）
          firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}\s+(INFO|ERROR|WARN|DEBUG)\s+\d+\s+---\s+\[[^\]]+\]'
          max_wait: 30s   # 等待后续行的最大时间（超时后发送）
          max_lines: 500  # 限制单条日志最大行数，避免内存溢出
          # 二级合并：业务块（如"=====【MTC入口】"）
          stages:
              - multiline:
                firstline: '^\s*={5,}【\w+】'
                max_wait: 1s
              # 三级合并：堆栈（兼容无换行场景）
              - multiline:
                  firstline: '^\s*(at|Caused by)\\b'
                  max_wait: 1s

      - regex:  # 结构化解析日志字段
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+\d+\s+---\s+\[(?P<thread>[^\]]+)\]\s+(?P<class>\S+)\s+(?P<method>\w+):(?P<line>\d+)\s+:(?P<log_body>.*)'

      # 异常堆栈检测（独立于日志级别！）
      - regex:
          expression: '(?s)(?P<has_exception>\S+?[^\n。]\s+at\s+\S+\.\S+\(.*\)(\s+at\s+\S+\.\S+\(.*\))*)'
            # 说明：
            #  (?s) 启用DOTALL模式（匹配换行符）
            #  .+?  非贪婪匹配异常描述（兼容中文）
            #  (?:\s+at\s+.*)+ 匹配连续堆栈行（兼容\t和空格）
          source: log_body
      - regex:
          expression: 'Caused by:\s+(?P<root_cause>\S+?):'  # 提取根因
          source: has_exception  # 从堆栈文本中提取
          if: 'has_exception != ""'  # ✅ 仅当存在堆栈时执行

      # ===== 堆栈清洗 =====
      # 目的：标准化堆栈格式，提升可读性
      - regex:
          expression: '\s+at\s+'
          replace: '  at '  # 统一缩进格式

      # 动态字段重组
      - template:
          source: log_body
          template: |
            {{ if and .has_exception (ne .has_exception "") }}
              {{ .log_body | Trim }}
            {{ else }}
              {{ .log_body }}
            {{ end }}

      - drop:
          expression: '^\s*$'  # 匹配空行
          source: log_body

      # 标签化策略（安全低基数）
      - labels: # 提取关键字段为标签，用于快速过滤日志流（如{level="ERROR"}），适合有限枚举值（如env、host）.而如method、class，应通过日志内容过滤（如{job="fee-server"} |= "getDeviceTrans"），避免污染索引
          level: # 按日志级别过滤（如{level="ERROR"}）
          exception_present: '{{ not (eq .has_exception "") }}'  # 有堆栈则为true

#      - output:
#          source: log_body


    static_configs:
      - targets: [localhost]  # 目标主机列表（本地采集时固定为 localhost）
        labels:
          job: fee-server         # 服务标识（必填）
          env: prod               # 环境标签（如测试/生产）
          zone: hebei
          host: "server-223"      # 低基数主机标识（替代高基数 IP）
          __path__: /var/lib/docker/volumes/virtual-station-logs/_data/emtc-server/full/**/*.log  # 递归匹配所有子目录的 .log 文件
          __path_exclude__: '.*\.(?i)gz$'   # 排除压缩文件（避免重复采集）

#  使用方式：
#  {job="fee-server", exception_present="true"}  # 查所有异常（无论级别）
#  {job="fee-server", level="WARN"} |= "SocketTimeout"  # 结合内容过滤
# {job="fee-server"} | json | root_cause != ""
