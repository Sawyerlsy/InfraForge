version: "3"
services:
  promtail: # （每台服务器独立部署）
    image: grafana/promtail:3.5
    security_opt:
      - seccomp:unconfined  # 解除线程创建限制
    cap_add:
      - SYS_RESOURCE       # 授予资源控制权限.为容器添加Linux的CAP_SYS_RESOURCE能力（Capability），允许其<200b><200b>突破内核资源限制
    container_name: promtail
    network_mode: host
    restart: always
    volumes:
      - ./config:/etc/promtail
      - ./positions:/tmp
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    command:
      - -config.file=/etc/promtail/config.yml
#      - -log.level=debug # 调试模式仅在有必要的时候打开

# 检查配置是否正确：docker-compose exec promtail promtail -config.file=/etc/promtail/config.yml -check-syntax
# 检查采集状态: http://10.194.68.223:9080/targets
