global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 服务器资源监控（Node Exporter）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Redis 监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # MySQL 双主监控
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # Kafka 监控
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # XXL-Job 监控
  - job_name: 'xxl-job'
    static_configs:
      - targets: ['xxl-job-exporter:9111']

  # Nacos 监控
  - job_name: 'nacos'
    static_configs:
      - targets: ['nacos-exporter:9112']

  # SpringCloud 微服务监控（假设微服务暴露 /actuator/prometheus）
  - job_name: 'springcloud'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
    kubernetes_sd_configs:
      - role: pod
