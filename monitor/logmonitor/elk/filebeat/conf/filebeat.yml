filebeat.inputs:
  - type: filestream
    id: parameter-server-logs # 唯一标识
    enabled: true
    paths: # glob模式
      - /var/lib/docker/volumes/virtual-station-logs/_data/parameter-server/**/*.log
    prospector.scanner.exclude_files:
      - '\.gz$'                  # 排除所有以.gz结尾的文件
      - 'gc/.*'                  # 排除gc目录下的所有文件
      - '.*20[0-9]{2}[0-9]{2}[0-9]{2}(\.[0-9]*)?\.log$' # 排除logall20251018.0.log和logall20251018.log
      - '.*-20[0-9]{2}-[0-9]{2}-[0-9]{2}(\.[0-9]*)?\.log$' # 排除log-2025-10-18.0.log、log-2025-10-18.log
    parsers:
      - multiline:
          type: pattern
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}\s+(INFO|ERROR|WARN|DEBUG)\s+\d+\s+---\s+\[[^\]]+\]'
          negate: true # negate和match的组合，表示不以指定模式开头的行（例如 Java 异常堆栈信息）都会被合并到上一行
          match: after
          max_lines: 100
          timeout: 3s
    fields: # 需要用于搜索的字段
      zone: guangdong
      app: virtual-station-rebuild
      service: parameter-server
      env: prod
      address: "10.194.66.229"
    fields_under_root: true # 让这些字段成为顶级字段，便于查询

