output.logstash:
  hosts: ["10.194.65.135:5044"]  # Logstash 服务器地址
  loadbalance: false


logging.level: info
logging.to_files: true
logging.files:
  path: /usr/share/filebeat/logs
  name: filebeat.log
  keepfiles: 7
  permissions: 0644


# 官方文档: https://search.elastic.co/?q=multiline&location%5B0%5D=Documentation&version%5B0%5D=9.0%2B
# encoding、exclude_lines、include_lines、harvester_buffer_size
# max_bytes: 单个日志消息可以拥有的最大字节数。超过max_bytes的所有字节将被丢弃而不发送。此设置对于可能变得很大的多行日志消息特别有用。默认值为10MB（10485760）

# ignore_older
# Filebeat将忽略在指定时间跨度之前修改的任何文件。可以使用时间字符串，如2h（2小时）和5m（5分钟）。默认值为0，表示禁用此设置。注释掉配置与将其设置为0具有相同的效果
# ignore_older设置必须大于close_inactive,

# close_*（关闭采集器的条件）: 关闭采集器意味着关闭文件句柄。若文件更新时采集器已关闭，需等待 scan_frequency 周期后重新采集。若文件被移动或删除，则数据丢失。

# close_inactive
#  如果文件在指定时间内没有任何新内容，Filebeat将关闭文件句柄, 否则会一直持有文件句柄.
# 定义周期的计数器在收集器读取最后一行日志时开始。它不是基于文件的修改时间。
# 如果关闭的文件再次更改，将在scan_frequency后启动新的收集器，并将拾取最新的更改。
# 建议您将close_inactive设置为大于日志文件最少更新间隔的值。例如，如果您的日志文件每几秒更新一次，您可以安全地将close_inactive设置为1m
# 时间字符串，如2h（2小时）和5m（5分钟）。默认值为5m
# 注意：filebeat持有文件句柄的时候,日志是实时采集的


# scan_frequency
# 指定用于收集的路径中的新文件的频率。例如，如果您指定一个glob如/var/log/*，则目录将使用scan_frequency指定的频率扫描文件。指定1s以尽可能频繁地扫描目录，而不会导致Filebeat扫描过于频繁。我们不建议设置此值<1s。
# 如果需要近实时发送日志行，不要使用非常低的scan_frequency，而是调整close_inactive，以便文件句柄保持打开并不断轮询您的文件。
# 默认设置为10s。

# 注意：
# clean_inactive: 默认为0,意味着filebeat不会自动清理注册表（registry）文件中的旧条目
# clean_inactive 必须大于( ignore_older + scan_frequency)，否则Filebeat会不断重新发送完整内容，因为状态被过早删除了


# harvester_limit
# 限制一个input（输入配置）同时可以启动的harvester数量，避免因同时处理过多文件而消耗过多系统资源。默认值0，表示无限制
# 如果input下面paths路径中总共有50个日志文件需要监控，harvester_limit设置为10，那么Filebeat会先启动10个harvester处理前10个文件
# 当有harvester完成任务（如文件被关闭）后，再启动新的harvester,最终所有50个文件都会被处理，但不会同时启动50个harvester
# 当启用harvester_limit并设置的值无法覆盖input下需要监控的所有文件时，close_inactive不能设置过大，否则活跃文件被长时间持有，占据了
# harvester_limit的资源，会导致input下的其他文件长时间无法被处理
