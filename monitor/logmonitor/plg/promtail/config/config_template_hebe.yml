#  使用方式：
# 按标签查询：{job="fee-server", level="WARN"}
# 排除特定标签：{job="fee-server"} - {level="DEBUG"}
# 查找包含 SocketTimeout 的日志：{job="fee-server"} |~ "SocketTimeout"
# 提取json字段,查找包含error_code的： {job="fee-server"} | json | error_code  != ""
# 查找 status=404 且 method=GET 的日志：  {job="fee-server"} | json | status = "404" and method = "GET"
