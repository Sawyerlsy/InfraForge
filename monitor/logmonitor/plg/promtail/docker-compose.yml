version: "3"
services:
  promtail: # （每台服务器独立部署）
    image: grafana/promtail:3.5
    security_opt:
      - seccomp:unconfined  # 解除线程创建限制
    cap_add:
      - SYS_RESOURCE       # 授予资源控制权限.为容器添加Linux的CAP_SYS_RESOURCE能力（Capability），允许其<200b><200b>突破内核资源限制
    container_name: promtail
    network_mode: host
    restart: always
    volumes:
      - ./config:/etc/promtail
      - ./positions:/tmp
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    command:
      - -config.file=/etc/promtail/config.yml
      #- -log.level=debug # 调试模式仅在有必要的时候打开
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: '1GB'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"  # 每个日志文件最大20MB
        max-file: "10"   # 轮转保留10个文件，总计约200MB
        compress: "true" # 启用压缩，节省空间（可选）

# mkdir -p positions && chmod -R 777 positions
# 检查配置是否正确：docker-compose exec promtail promtail -config.file=/etc/promtail/config.yml -check-syntax
