# ----------------------
# Nacos集群 (3节点)
# ----------------------
# upstream 中禁用下划线, 可能被部分 Nginx 版本识别为非法字符
# 该处配置仅用于健康检查,生产环境中客户端需使用直连的方式连接 Nacos 集群,否则会导致集群服务异常
upstream nacos-cluster {
    server 10.194.65.133:8848;
    server 10.194.65.134:8848;
    server 10.194.65.135:8848;

    # 健康检查（HTTP API）
    check interval=3000 rise=2 fall=3 timeout=3000 default_down=false type=http;
    check_http_send "HEAD /nacos/actuator/health HTTP/1.0\r\n\r\n";
    check_http_expect_alive http_2xx http_3xx;
}

server {
    listen 8848;  # 按需开启端口复用

    location / {
        proxy_pass http://nacos-cluster/;
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header backendIP $upstream_addr;
        add_header backendCode $upstream_status;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        access_log /var/log/nginx/http/nacos_access.log main;
    }
}
