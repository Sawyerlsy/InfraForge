 # ----------------------
# 传输服务
# ----------------------
upstream transfer-cluster {
    server 10.194.68.230:8182;
    server 10.194.68.231:8182 backup; # 当且仅当所有非backup节点都不可用时，Nginx才会将请求分发到backup节点

    # 显式关闭后端长连接复用（1.29.7 起 nginx 默认开启且上限 32），保持与 1.28.0 一致的短连接行为
    keepalive 0;

    # 健康检查
    check interval=5000 rise=2 fall=3 timeout=3000 default_down=false type=http;
    check_http_send "POST /api/v1/param/query HTTP/1.0\r\n\r\n";
    check_http_expect_alive http_2xx http_4xx;

}

server {
    listen 8182;

    location / {
        proxy_pass http://transfer-cluster/;
        proxy_http_version 1.1; # 显式声明为 1.1（1.30.6 的默认值），避免回退到 1.28.0 时隐式变回 1.0
    }
}
