 # ----------------------
# 黑名单服务
# ----------------------
upstream blackserver-cluster {
    server 10.194.66.117:8998;
    server 10.194.66.118:8998;

    # 健康检查
    check interval=3000 rise=2 fall=3 timeout=3000 default_down=false type=http;
    check_http_send "HEAD /paramServer?cmdtype=blacklistupdatequery&tbtype=0&version=201708031 HTTP/1.0\r\n\r\n";
    check_http_expect_alive http_2xx http_3xx;
}

server {
    listen 8998;
   # 后台转发
   location / {
       proxy_pass http://blackserver-cluster/;
       add_header 'Access-Control-Allow-Origin' '*';
       add_header 'Access-Control-Allow-Credentials' 'true';
       add_header backendIP $upstream_addr;
       add_header backendCode $upstream_status;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection $connection_upgrade;
       proxy_connect_timeout 7d;
       proxy_send_timeout 7d;
       proxy_read_timeout 7d;

       access_log /var/log/nginx/http/black_access.log main;
   }
}
