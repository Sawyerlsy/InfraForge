 # ----------------------
# XXL-JOB Admin集群 (双节点)
# ----------------------
upstream xxljob-cluster {
    server 10.194.65.133:9999;
    server 10.194.65.134:9999;

    # 健康检查（Spring Boot Actuator）
    check interval=5000 rise=2 fall=3 timeout=3000 default_down=false type=http;
    check_http_send "HEAD /dispatch/actuator/health HTTP/1.0\r\n\r\n";
    check_http_expect_alive http_2xx http_3xx;

}

server {
    listen 9999;

    location / {
        proxy_pass http://xxljob-cluster/;
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header backendIP $upstream_addr;
        add_header backendCode $upstream_status;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        access_log /var/log/nginx/http/xxl_access.log main;
    }
}
