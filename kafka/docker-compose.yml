version: '3.8'
services:
  kafka:
    image: apache/kafka:4.1.1
    security_opt:
      - seccomp:unconfined  # 解除线程创建限制
    cap_add:
      - SYS_RESOURCE
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 1 # 节点唯一标识,每个节点必须不同
      KAFKA_CLUSTER_ID: sawyer-kafka-standalone # 集群唯一标识
      KAFKA_PROCESS_ROLES: broker,controller # 节点角色：controller(元数据管理) + broker(消息存储)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # 指定名为 CONTROLLER的监听器（即端口 9093）进行 KRaft 元数据同步等内部操作
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # 定义Controller 仲裁组的成员列表,集群部署时列出所有,单节点时使用容器名称
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.194.65.133:9092 # 这里需要修改为实际的IP地址,客户端连接时使用的地址
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 10
      KAFKA_NUM_PARTITIONS: 3 # 用户创建主题的默认分区数
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1 # 用户创建主题的默认副本数
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /opt/kafka/data

      KAFKA_LOG_RETENTION_HOURS: 168 # 主题分区下数据默认保留168小时
      #KAFAKA_LOG_RETENTION_BYTES: 1073741824 # 主题单个分区下数据保留1G,默认不限制
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/opt/kafka/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '2GB'

# mkdir -p data && chmod -R 777 data
# 修改IP
# docker-compose --compatibility up -d
# KRaft模式部署,不依赖zookeeper

# 1、基础连接测试: 获取主题列表
# docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list

# 2、创建主题
# 2.1 指定分区数和副本
# docker exec kafka /opt/kafka/bin/kafka-topics.sh --create --topic test-topic --partitions 1 --replication-factor 1 --bootstrap-server localhost:9092
# 2.2 不指定分区数和副本
# docker exec kafka /opt/kafka/bin/kafka-topics.sh --create --topic test-topic --bootstrap-server localhost:9092

# 3、生产和消费
# 3.1. 启动控制台消费者
# docker exec -it kafka /bin/bash
# /opt/kafka/bin/kafka-console-consumer.sh --topic test-topic --from-beginning --bootstrap-server localhost:9092
# 3.2. 启动控制台生产者并发送消息：
# docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh --topic test-topic --bootstrap-server localhost:9092
# 3.3 在出现的交互式命令行中输入几条测试消息（如Hello、Test），每输完一条按一次回车，最后按Ctrl+C退出。
# 3.4. 查看消费者日志：
# docker logs --tail 10 kafka
