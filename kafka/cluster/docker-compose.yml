version: '3.8'
services:
  kafka:
    image: apache/kafka:4.1.1
    security_opt:
      - seccomp:unconfined  # 解除线程创建限制
    cap_add:
      - SYS_RESOURCE       # 授予资源控制权限.为容器添加Linux的CAP_SYS_RESOURCE能力（Capability），允许其<200b><200b>突破内核资源限制
    container_name: kafka-1
    restart: always
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 1 # 节点唯一标识,每个节点必须不同
      KAFKA_CLUSTER_ID: sawyer-kafka-cluster # 集群唯一标识
      KAFKA_PROCESS_ROLES: broker,controller # 节点角色：controller(元数据管理) + broker(消息存储)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # 指定名为 CONTROLLER的监听器（即端口 9093）进行 KRaft 元数据同步等内部操作
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@10.194.65.133:9093,2@10.194.65.134:9093,3@10.194.65.135:9093 # 定义Controller 仲裁组的成员列表,集群部署时列出所有
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.194.65.133:9092 # 这里需要修改为实际的IP地址,客户端连接时使用的地址
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # 内部主题__consumer_offsets 分区的副本数,每个分区有3个副本，可以容忍2个节点故障,小于等于节点数量
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 50 # 内部主题__consumer_offsets 主题的分区数,控制并行处理能力,控制并行处理能力
      KAFKA_NUM_PARTITIONS: 3 # 用户创建主题的默认分区数
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2 # 用户创建主题的默认副本数,需要小于或等于broker数量
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true' # 允许自动创建主题
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2 # 事务状态日志复制因子
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # 事务状态日志最小ISR
      KAFKA_LOG_DIRS: /opt/kafka/data

      KAFKA_LOG_RETENTION_HOURS: 168 # 主题分区下数据默认保留168小时
      #KAFAKA_LOG_RETENTION_BYTES: 1073741824 # 主题单个分区下数据保留1G,默认不限制
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/opt/kafka/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '2GB'


# mkdir -p data && chmod -R 777 data
# docker-compose --compatibility up -d
# KRaft模式部署,不依赖zookeeper

# 1、集群状态检查
# 检查Controller选举状态: docker exec kafka-1 /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server 10.194.65.133:9092 describe --status
# 检查Quorum复制状态: docker exec kafka-1 /opt/kafka/bin/kafka-metadata-quorum.sh  --bootstrap-server 10.194.65.133:9092 describe --replication
# 检查Broker注册状态: docker exec kafka-1 /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 10.194.65.133:9092
#

# 2. 创建测试主题
# docker exec kafka-1 /opt/kafka/bin/kafka-topics.sh --bootstrap-server 10.194.65.133:9092 --create --topic test-cluster-health --partitions 3 --replication-factor 2

# 3. 检查副本分布
# docker exec kafka-1 /opt/kafka/bin/kafka-topics.sh --bootstrap-server 10.194.65.133:9092 --describe --topic test-cluster-health

# 4. 生产测试消息
# echo "集群健康测试消息 $(date)" | docker exec -i kafka-1 /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server 10.194.65.133:9092,10.194.65.134:9092,10.194.65.135:9092 --topic test-cluster-health

# 5. 消费测试消息
# docker exec kafka-1 /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server 10.194.65.133:9092,10.194.65.134:9092,10.194.65.135:9092 --topic test-cluster-health --from-beginning --timeout-ms 10000 --max-messages 1
